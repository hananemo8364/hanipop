<html lang="en">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my counter</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="counter">
        <h1 class="counter_title">salavut shomar</h1>
        <span class="counter_value">0</span>
        <button class="counter_reset-button">
                ↻
        </button>
        <div class="counter_buttons">
            <button class="counter_button counter_button--decrease">
                -
            </button>
            <button class="counter_button counter_button--increase">
                +
            </button>
        </div>
    </div>
    <script src="hanane.js"></script>
</body>

</html>
